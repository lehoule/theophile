name = "theophile"
main = "worker/index.ts"
compatibility_date = "2026-07-25"
preview_urls = false

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "theophile-comments"
database_id = "bdb4a442-b121-451d-add1-9c911406dce9"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "theophile-media"

[[r2_buckets]]
binding = "PRIVATE_BACKUPS"
bucket_name = "theophile-private"

[triggers]
crons = ["17 3 1 * *"]

[[routes]]
pattern = "theophile.blog"
custom_domain = true

[vars]
SITE_ORIGIN = "https://theophile.blog"
MEDIA_PUBLIC_ORIGIN = "https://media.theophile.blog"
